name: Spell Check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typos:
    name: Spell Check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Spelling
        uses: crate-ci/typos@v1
